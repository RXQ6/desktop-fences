[package]
name = "desktop-fences"
version = "0.1.0"
edition = "2021"
description = "超轻量桌面分区整理工具 - Fences 风格的 Rust 实现"
authors = ["you"]

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_Security",
    "implement",
] }
windows-core = "0.58"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# 临时诊断版：与主程序同名输出（避免主 exe 被运行中进程锁住时无法链接）
# 诊断完成后删除
[[bin]]
name = "desktop-fences-dbg"
path = "src/main.rs"
